version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      codeql-actions:
        applies-to: version-updates
        # CodeQL init and analyze must be upgraded together to the same version.
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
