name: GDMS Integration CI

on:
  push:
    branches:
      - main
      - "ci/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
    name: CLI and package checks — PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 26
        # setup-node itself uses the GitHub Actions Node 24 runtime; this sets
        # Node 26 for npm, asset preparation and CLI/package build commands.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install, audit and stage pinned browser asset
        run: |
          npm ci --ignore-scripts --no-audit
          npm audit --audit-level=moderate
          bash scripts/update-vis-network.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, zip
          coverage: none

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Show runtime
        run: php -v

      - name: PHP syntax
        run: |
          find setup.php hook.php src tests .github -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -r -n1 php -l

      - name: Run CLI business-logic tests
        run: php tests/run.php

      - name: Run PBX/SIP account regression tests
        run: php tests/pbx_association_regression.php

      - name: Run GDMS rate-limit regression tests
        run: php tests/gdms_rate_limit_regression.php

      - name: Check external JavaScript syntax
        run: |
          node --check public/js/config.js
          node --check public/js/dashboard.js

      - name: Run firmware-channel regression tests
        run: php tests/firmware_channel_regression.php

      - name: Run firmware catalogue cache regression tests
        run: php tests/firmware_catalog_cache_regression.php

      - name: Run GWN alert deduplication regression tests
        run: php tests/gwn_alert_dedup_regression.php

      - name: Run port-modal DOM-XSS regression tests
        run: node tests/port_modal_xss_regression.js

      - name: Run CSP/template renderer regression tests
        run: php tests/csp_readiness_regression.php

      - name: Run WAN gateway link regression tests
        run: php tests/wan_gateway_link_regression.php

      - name: Execute WAN gateway URL validation cases
        run: node tests/wan_gateway_link_regression.js

      - name: Verify bundled vis-network manifest
        run: php tests/vis_network_manifest_regression.php

      - name: Validate release metadata and source layout
        run: php tests/validate-release.php

      - name: Build and validate installation ZIP
        id: package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gdms-dist"

          # Exercise the packager's clean-checkout path in the artifact-producing
          # PHP 8.3 leg: remove CI-staged dependencies/assets so package.sh must
          # restore the pinned dependency from package-lock.json and regenerate
          # the UMD bundle and source-only integrity manifest. License texts live
          # in THIRD-PARTY-NOTICES.md, not beside the browser runtime asset.
          if [[ "${{ matrix.php }}" == "8.3" ]]; then
            rm -rf node_modules
            git checkout -- public/js/vis-network.min.js public/js/vis-network.manifest.json
          fi

          bash scripts/package.sh "$RUNNER_TEMP/gdms-dist"
          mapfile -t archives < <(find "$RUNNER_TEMP/gdms-dist" -maxdepth 1 -type f -name 'gdmsintegration-*.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one generated plugin archive; found ${#archives[@]}." >&2
            exit 1
          fi
          archive="${archives[0]}"
          test -f "$archive"
          unzip -t "$archive"
          if unzip -Z1 "$archive" | grep -Evq '^gdmsintegration(/|$)'; then
            echo "The archive contains a path outside gdmsintegration/." >&2
            exit 1
          fi
          if unzip -Z1 "$archive" | grep -Eq '^gdmsintegration/(tests|scripts|\.github|vendor)(/|$)'; then
            echo "Development files leaked into the installation ZIP." >&2
            exit 1
          fi
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/setup.php'
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/hook.php'
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/src/Sync.php'
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/templates/dashboard.html.twig'
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/public/js/config.js'
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/public/js/dashboard.js'
          unzip -Z1 "$archive" | grep -qx 'gdmsintegration/public/js/vis-network.min.js'
          public_js_entries="$(unzip -Z1 "$archive" | grep -E '^gdmsintegration/public/js/[^/]+$' || true)"
          expected_public_js_entries="$(printf '%s\\n' \\
    gdmsintegration/public/js/config.js \\
    gdmsintegration/public/js/dashboard.js \\
    gdmsintegration/public/js/vis-network.min.js | sort)"
actual_public_js_entries="$(printf '%s\\n' "${public_js_entries}" | sed '/^$/d' | sort)"
if [[ "$actual_public_js_entries" != "$expected_public_js_entries" ]]; then
    printf 'Unexpected files in installable public/js directory:\\n%s\\n' "${public_js_entries:-<none>}" >&2
    exit 1
fi

          # Upload the exact archive created by the packager, without
          # duplicating the plugin version in the workflow definition.
          checksum="${archive}.sha256"
          sha256sum "$archive" > "$checksum"
          printf 'archive_path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum_path=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload installable GDMS Integration ZIP
        # This unprivileged PR/push workflow uploads the package artifact;
        # no privileged workflow consumes artifacts built from PR code.
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdmsintegration-installable
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
