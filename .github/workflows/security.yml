name: GDMS Integration Security Analysis

on:
  push:
    branches:
      - main
      - "ci/**"
      - "security/**"
    tags:
      - "1.*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdms-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glpi-static-analysis:
    name: GLPI-aware PHP and Twig analysis — GLPI ${{ matrix.glpi }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi: "11.0"
            glpi_ref: "11.0/bugfixes"
            php: "8.3"
          - glpi: "12.0"
            glpi_ref: "12.0/bugfixes"
            php: "8.5"

    steps:
      # PR source is inspected only in this unprivileged pull_request job:
      # contents:read, no repository secrets, no persisted checkout credentials,
      # and no execution of plugin-defined scripts. Do not change this to pull_request_target.
      - name: Checkout plugin source for static analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # GLPI core is fetched from fixed, trusted matrix refs; no PR-controlled ref is used.
      - name: Checkout GLPI ${{ matrix.glpi }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi_ref }}
          path: glpi
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, ldap, mbstring, mysqli, sodium, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install GLPI development analysis tools
        working-directory: glpi
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --ignore-platform-req=php+ \
            --no-scripts

      - name: Prepare plugin analysis workspace
        run: |
          mkdir -p glpi/plugins/gdmsintegration
          cp -a setup.php hook.php src templates glpi/plugins/gdmsintegration/
          cp .github/phpstan-gdms.neon glpi/phpstan-gdms.neon

      - name: Verify installed GLPI PSR-4 namespace and class-to-file mapping
        run: |
          php "$GITHUB_WORKSPACE/.github/scripts/check-psr4.php" \
            "$GITHUB_WORKSPACE/glpi/plugins/gdmsintegration/src" \
            'GlpiPlugin\Gdmsintegration' \
            "$GITHUB_WORKSPACE/glpi/vendor/autoload.php"

      - name: Audit PHP code style with the GLPI PHP-CS-Fixer rules
        # Report historical formatting findings; pin a measured baseline before
        # converting the full-repository audit into a blocking gate.
        continue-on-error: true
        env:
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          glpi/vendor/bin/php-cs-fixer check \
            --config=.github/php-cs-fixer-plugin.php \
            --using-cache=no \
            --diff

      - name: Enforce GLPI PHP style on changed runtime files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t changed_php < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | grep -E '^(setup\.php|hook\.php|src/.+\.php)$' || true
          )
          if [[ ${#changed_php[@]} -eq 0 ]]; then
            echo "No changed runtime PHP files; style gate is not applicable."
            exit 0
          fi
          glpi/vendor/bin/php-cs-fixer check \
            --config=.github/php-cs-fixer-plugin.php \
            --path-mode=intersection \
            --using-cache=no \
            --diff \
            "${changed_php[@]}"

      - name: PHP lint with deprecated-syntax detection
        working-directory: glpi
        run: |
          vendor/bin/parallel-lint \
            --show-deprecated \
            --colors \
            plugins/gdmsintegration/setup.php \
            plugins/gdmsintegration/hook.php \
            plugins/gdmsintegration/src

      - name: Twig lint using GLPI rules
        working-directory: glpi
        run: |
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\Tools\GlpiTwigRuleset' \
            --exclude dashboard.html.twig \
            plugins/gdmsintegration/templates

      - name: PHPStan level 8 with GLPI extensions
        # Existing 1.6.7 findings are tracked as diagnostics; do not block the tooling-only PR.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan-gdms.neon \
            --no-progress \
            --error-format=github \
            --memory-limit=1G

      - name: Psalm security and taint analysis
        # Existing 1.6.7 findings are tracked as diagnostics; do not block the tooling-only PR.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/psalm \
            --config="$GITHUB_WORKSPACE/.github/psalm-gdms.xml" \
            --long-progress \
            --output-format=github

      - name: Audit the GDMS dashboard Twig template
        # Keep the previously excluded dashboard template visible while its
        # legacy formatting findings are measured and remediated.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\\Tools\\GlpiTwigRuleset' \
            plugins/gdmsintegration/templates/dashboard.html.twig

  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - public/js/vis-network.min.js

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  workflow-audit:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          persona: regular
          min-severity: medium
          min-confidence: medium
