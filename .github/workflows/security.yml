name: GDMS Integration Security Analysis

on:
  push:
    branches:
      - main
      - "ci/**"
      - "security/**"
    tags:
      - "1.*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdms-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glpi-static-analysis:
    name: GLPI-aware PHP and Twig analysis — GLPI ${{ matrix.glpi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi: "11.0"
            glpi_ref: "11.0/bugfixes"
            php: "8.3"
          - glpi: "12.0"
            glpi_ref: "12.0/bugfixes"
            php: "8.5"

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout GLPI ${{ matrix.glpi }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi_ref }}
          path: glpi
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, ldap, mbstring, mysqli, sodium, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install GLPI development analysis tools
        working-directory: glpi
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --ignore-platform-req=php+ \
            --no-scripts

      - name: Prepare plugin analysis workspace
        run: |
          mkdir -p glpi/plugins/gdmsintegration
          cp -a setup.php hook.php src templates glpi/plugins/gdmsintegration/
          cp .github/phpstan-gdms.neon glpi/phpstan-gdms.neon

      - name: PHP lint with deprecated-syntax detection
        working-directory: glpi
        run: |
          vendor/bin/parallel-lint \
            --show-deprecated \
            --colors \
            plugins/gdmsintegration/setup.php \
            plugins/gdmsintegration/hook.php \
            plugins/gdmsintegration/src

      - name: Twig lint using GLPI rules
        working-directory: glpi
        run: |
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\Tools\GlpiTwigRuleset' \
            --exclude dashboard.html.twig \
            plugins/gdmsintegration/templates

      - name: PHPStan level 8 with GLPI extensions
        working-directory: glpi
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan-gdms.neon \
            --no-progress \
            --error-format=github \
            --memory-limit=1G

      - name: Psalm security and taint analysis
        working-directory: glpi
        run: |
          vendor/bin/psalm \
            --config="$GITHUB_WORKSPACE/.github/psalm-gdms.xml" \
            --long-progress \
            --output-format=github

  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - public/js/vis-network.min.js

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  workflow-audit:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          persona: regular
          min-severity: medium
          min-confidence: medium
