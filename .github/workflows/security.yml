name: GDMS Integration Security Analysis

on:
  push:
    branches:
      - main
      - "ci/**"
      - "security/**"
    tags:
      - "1.*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdms-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glpi-static-analysis:
    name: GLPI-aware PHP and Twig analysis — GLPI ${{ matrix.glpi }}
    # Use fresh GitHub-hosted runners for untrusted PR source. Do not add caches,
    # upload PR-derived artifacts, or pass PR data to privileged workflow_run jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi: "11.0"
            glpi_ref: "11.0/bugfixes"
            php: "8.3"
          - glpi: "12.0"
            glpi_ref: "12.0/bugfixes"
            php: "8.5"

    steps:
      # PR source is inspected only in this unprivileged pull_request job:
      # fork PRs receive a read-only GITHUB_TOKEN and no repository secrets;
      # checkout credentials are not persisted and plugin-defined scripts are not run.
      # Keep this on GitHub-hosted runners, without caches or PR artifact handoffs.
      # Do not change this to pull_request_target.
      - name: Checkout plugin source for static analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # GLPI core is fetched from fixed, trusted matrix refs; no PR-controlled ref is used.
      - name: Checkout GLPI ${{ matrix.glpi }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glpi-project/glpi
          ref: ${{ matrix.glpi_ref }}
          path: glpi
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, ldap, mbstring, mysqli, sodium, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install GLPI development analysis tools
        working-directory: glpi
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --ignore-platform-req=php+ \
            --no-scripts

      - name: Prepare plugin analysis workspace
        run: |
          mkdir -p glpi/plugins/gdmsintegration
          cp -a setup.php hook.php src templates glpi/plugins/gdmsintegration/
          cp .github/phpstan-gdms.neon glpi/phpstan-gdms.neon

      - name: Verify installed GLPI PSR-4 namespace and class-to-file mapping
        run: |
          php "$GITHUB_WORKSPACE/.github/scripts/check-psr4.php" \
            "$GITHUB_WORKSPACE/glpi/plugins/gdmsintegration/src" \
            'GlpiPlugin\Gdmsintegration' \
            "$GITHUB_WORKSPACE/glpi/vendor/autoload.php"

      - name: PHP-CS-Fixer baseline — GLPI @PER-CS3x0
        env:
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set +e
          glpi/vendor/bin/php-cs-fixer check \
            --config=.github/php-cs-fixer-plugin.php \
            --using-cache=no \
            --diff \
            > "$RUNNER_TEMP/php-cs-fixer.log" 2>&1
          fixer_status=$?
          set -e
          cat "$RUNNER_TEMP/php-cs-fixer.log"

          findings="$(sed -nE 's/^.*Found ([0-9]+) of [0-9]+ files that can be fixed.*$/\1/p' "$RUNNER_TEMP/php-cs-fixer.log" | tail -n 1)"
          if [[ -z "$findings" ]]; then
            if [[ "$fixer_status" -eq 0 ]]; then
              findings=0
            else
              echo "PHP-CS-Fixer failed before reporting a count." >&2
              exit "$fixer_status"
            fi
          fi

          baseline=26
          if (( findings > baseline )); then
            echo "PHP style findings increased: $findings files need fixing (baseline: $baseline)." >&2
            exit 1
          fi
          echo "PHP-CS-Fixer baseline: $findings/$baseline files need formatting; no increase detected."

      - name: Enforce GLPI PHP style on changed runtime files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t changed_php < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | grep -E '^(setup\.php|hook\.php|src/.+\.php)$' || true
          )
          if [[ ${#changed_php[@]} -eq 0 ]]; then
            echo "No changed runtime PHP files; style gate is not applicable."
            exit 0
          fi
          glpi/vendor/bin/php-cs-fixer check \
            --config=.github/php-cs-fixer-plugin.php \
            --path-mode=intersection \
            --using-cache=no \
            --diff \
            "${changed_php[@]}"

      - name: PHP lint with deprecated-syntax detection
        working-directory: glpi
        run: |
          vendor/bin/parallel-lint \
            --show-deprecated \
            --colors \
            plugins/gdmsintegration/setup.php \
            plugins/gdmsintegration/hook.php \
            plugins/gdmsintegration/src

      - name: Twig lint using GLPI rules
        working-directory: glpi
        run: |
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\Tools\GlpiTwigRuleset' \
            --exclude dashboard.html.twig \
            plugins/gdmsintegration/templates

      - name: PHPStan level 8 with GLPI extensions
        # Existing 1.6.7 findings are tracked as diagnostics; do not block the tooling-only PR.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan-gdms.neon \
            --no-progress \
            --error-format=github \
            --memory-limit=1G

      - name: Psalm security and taint analysis
        # Existing 1.6.7 findings are tracked as diagnostics; do not block the tooling-only PR.
        continue-on-error: true
        working-directory: glpi
        run: |
          vendor/bin/psalm \
            --config="$GITHUB_WORKSPACE/.github/psalm-gdms.xml" \
            --long-progress \
            --output-format=github

      - name: GDMS dashboard TwigCS baseline
        working-directory: glpi
        run: |
          set +e
          vendor/bin/twigcs \
            --ansi \
            --no-interaction \
            --ruleset='Glpi\Tools\GlpiTwigRuleset' \
            plugins/gdmsintegration/templates/dashboard.html.twig \
            > "$RUNNER_TEMP/twigcs-gdms-dashboard.log" 2>&1
          twig_status=$?
          set -e
          cat "$RUNNER_TEMP/twigcs-gdms-dashboard.log"

          violations="$(grep -oE '[0-9]+ violation\(s\) found' "$RUNNER_TEMP/twigcs-gdms-dashboard.log" | grep -oE '^[0-9]+' | tail -n 1)"
          if [[ -z "$violations" ]]; then
            if [[ "$twig_status" -eq 0 ]]; then
              violations=0
            else
              echo "TwigCS dashboard check failed without a parseable violation count." >&2
              exit "$twig_status"
            fi
          fi

          baseline=82
          if (( violations > baseline )); then
            echo "GDMS dashboard TwigCS findings increased: $violations (baseline: $baseline)." >&2
            exit 1
          fi
          echo "GDMS dashboard TwigCS baseline: $violations/$baseline; no increase detected."

  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - public/js/vis-network.min.js

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  workflow-audit:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          persona: regular
          min-severity: medium
          min-confidence: medium
